name: CI

# Lot 1.1 (13/08/2026, remédiation GAP-14-02) — préparation des contrôles
# CI/CD demandée par le master plan sécurité (section 14/15). Ce workflow
# est un point de départ minimal : build + vérification de types + audit
# de dépendances en lecture seule sur chaque push/PR touchant main. Il ne
# déploie rien (Netlify gère déjà le déploiement séparément via
# @netlify/plugin-nextjs) et ne bloque aucun merge tant qu'aucune "required
# status check" n'est activée côté GitHub (Settings → Branches) — cette
# activation est une action à faire par Bryan, hors de portée du code.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    # De nombreuses routes API instancient leur client Supabase/leurs
    # secrets JWT/VAPID au niveau module (hors handler) - Next.js exécute
    # ce code au chargement pendant "Collecting page data", même en
    # l'absence de toute requête réelle pendant le build. Ces valeurs sont
    # des placeholders jetables, jamais des vrais secrets : aucun appel
    # réseau n'est fait pendant le build, elles servent uniquement à
    # satisfaire les validations de format (URL/clé non vide, clé VAPID
    # 65 octets decodee) pour que le build aboutisse. VAPID_PRIVATE_KEY/
    # NEXT_PUBLIC_VAPID_PUBLIC_KEY ci-dessous forment une paire generee
    # avec web-push, sans lien avec un vrai abonnement push.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build-only
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-for-ci-build-only
      ADMIN_JWT_SECRET: placeholder-secret-for-ci-build-only-0000000000000000
      ADMIN_ENTRY_TOKEN: placeholder-secret-for-ci-build-only-0000000000000000
      ADMIN_ENTRY_WEBAUTHN_JWT_SECRET: placeholder-secret-for-ci-build-only-0000000000000000
      ADMIN_OTP_FALLBACK: "000000"
      CHECKIN_JWT_SECRET: placeholder-secret-for-ci-build-only-0000000000000000
      CITOYEN_OTP_FALLBACK: "000000"
      CITOYEN_TOTP_CHALLENGE_JWT_SECRET: placeholder-secret-for-ci-build-only-0000000000000000
      CITOYEN_WEBAUTHN_JWT_SECRET: placeholder-secret-for-ci-build-only-0000000000000000
      EMPLOYEE_JWT_SECRET: placeholder-secret-for-ci-build-only-0000000000000000
      INSTITUTION_JWT_SECRET: placeholder-secret-for-ci-build-only-0000000000000000
      INSTITUTION_OTP_FALLBACK: "000000"
      INSTITUTION_TOTP_CHALLENGE_JWT_SECRET: placeholder-secret-for-ci-build-only-0000000000000000
      MOBILE_WALL_ENABLED: "false"
      NEXT_PUBLIC_APP_URL: https://example.com
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: BGCBAFnXrEZh8VlwuZOljwEYalEpziGu0WR1WKyLtwr6Cs_3QJ6BU7CiRpj47mk9CqwL2nU5rpgCPgzsGl4rvUE
      VAPID_PRIVATE_KEY: sKZHj4Zf6_BCgos0seQVjfnjGMoEsbYMiadJlSMHLKo
      VAPID_SUBJECT: mailto:ci-build@example.com
      QR_SECRET_KEY: placeholder-secret-for-ci-build-only-0000000000000000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    # Informationnel uniquement pour l'instant (continue-on-error) — le
    # projet a des vulnérabilités connues et documentées dans
    # docs/security/YELEN_SECURITY_GAP_ANALYSIS.md (GAP-14-01), certaines
    # ne peuvent être corrigées qu'avec --force (bump majeur de next). Ne
    # doit pas faire échouer la CI tant que ce gap n'est pas traité
    # explicitement par Bryan.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (informationnel)
        run: npm audit --omit=dev
        continue-on-error: true
