# Analyse statique CodeQL (JavaScript/TypeScript). Les résultats apparaissent
# dans l'onglet Security > Code scanning du dépôt (voir la description de la
# PR qui a introduit ce fichier pour les réglages GitHub à activer).
# Actions épinglées sur un SHA de commit : dependabot.yml (écosystème
# github-actions) propose les mises à jour.
name: CodeQL

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # chaque lundi, 03:17 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"
